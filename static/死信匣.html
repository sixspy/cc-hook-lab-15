<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>死信匣 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html">端点名册</a>
      <a href="/事件队列.html">事件队列</a>
      <a href="/投递流水.html">投递流水</a>
      <a href="/死信匣.html" class="亮">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>死信匣</h1>
      <p>Webhook 投递控制台 · 应用开发全栈 · 非工单客服</p>
    </header>

<section class="卷">
  <label>事件号</label><input id="事件号"/>
  <p class="消息" id="消息"></p>
  <button class="按钮" type="button" id="重投钮">死信重投</button>
  <button class="按钮 次" type="button" id="作废钮">作废</button>
</section>
<section class="卷"><div class="策略条">死信命运：失败次数耗尽签名规「最大重试」后入匣待处置；重投回待投再走投递口——闭窗灯红时重投会被前置联拒，死信留匣不做半截翻转。</div></section>
<section class="卷"><div class="表绕"><table><thead><tr><th>死信号</th><th>事件号</th><th>端点键</th><th>失败次数</th><th>末次原因</th><th>状态</th><th>中文命运</th></tr></thead><tbody id="表"></tbody></table></div></section>

  </main>

<script>
async function 刷表() {
  const rows = await 投递台.getJSON('/api/死信');
  const tb = document.getElementById('表'); tb.innerHTML='';
  for (const r of rows) {
    const 命运 = r.状态 === '待处置'
      ? '待处置：可重投（闭窗时联拒留匣）或人工作废'
      : (r.状态 === '已重投' ? '已重投：事件回待投，重新走签名投递' : '已作废：人工作废留痕');
    const tr = 投递台.行('<td>'+投递台.安全文本(r.死信号)+'</td><td>'+投递台.安全文本(r.事件号)+'</td><td>'+投递台.安全文本(r.端点键)+'</td><td>'+投递台.安全文本(r.失败次数)+'</td><td>'+投递台.安全文本(r.末次原因)+'</td><td></td><td class="命运"></td>');
    tr.children[5].appendChild(投递台.徽章(r.状态));
    tr.children[6].textContent = 命运;
    tb.appendChild(tr);
  }
}
document.getElementById('重投钮').onclick = async () => {
  try {
    const rep = await 投递台.postJSON('/api/死信/重投', {事件号: document.getElementById('事件号').value});
    document.getElementById('消息').textContent = JSON.stringify(rep);
    await 刷表();
  } catch (e) { document.getElementById('消息').textContent = e.message; }
};
document.getElementById('作废钮').onclick = async () => {
  try {
    const rep = await 投递台.postJSON('/api/死信/作废', {事件号: document.getElementById('事件号').value});
    document.getElementById('消息').textContent = JSON.stringify(rep);
    await 刷表();
  } catch (e) { document.getElementById('消息').textContent = e.message; }
};
刷表();
</script>

</body>
</html>
